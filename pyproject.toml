[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraper"
version = "0.2.0"
description = "Extensible, async-capable web scraping engine with JS support, declarative form interactions, and SQL Server storage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPLv2" }
authors = [{ name = "Gerard Casas", email = "g3casas@gmail.com" }]
keywords = ["scraping", "web", "automation", "playwright", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GPLv2 License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: AsyncIO",
]

dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/TheBugCommit/web-scrapper"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RET", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
